<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="navyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1128"/>
      <stop offset="100%" stop-color="#060B18"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9E7E50"/>
    </linearGradient>
  </defs>
  <!-- Background Disc -->
  <circle cx="256" cy="256" r="250" fill="url(#navyBg)" stroke="url(#goldRing)" stroke-width="12"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#goldRing)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
  
  <!-- Sacred Diadem & Chowdeshwari Crown Symbol -->
  <path d="M256 120 L280 170 L340 180 L295 220 L310 280 L256 250 L202 280 L217 220 L172 180 L232 170 Z" fill="url(#goldRing)" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.5))"/>
  
  <!-- Monogram SCT -->
  <text x="256" y="360" font-family="'Playfair Display', Georgia, serif" font-size="72" font-weight="bold" fill="url(#goldRing)" text-anchor="middle" letter-spacing="4">SCT</text>
  <text x="256" y="410" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="600" fill="#E8D5BA" text-anchor="middle" letter-spacing="8">SHREE CHOWDESHWARI</text>
  <text x="256" y="435" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#94A3B8" text-anchor="middle" letter-spacing="6">TOURS &amp; TRAVELS</text>
</svg>
